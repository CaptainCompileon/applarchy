name: Release

# Every push to main that changes the app becomes a release. scripts/next-version.sh works
# out the version from the labels of the pull requests merged since the latest release
# (release: major / minor / patch / skip; bug → patch, enhancement → minor; no label → patch),
# build.yml builds the DMG with that version, and the GitHub release vX.Y[.Z] is created
# with it. Pull requests get a dry run: their check says what merging them would release as.
# Run it by hand (Actions → Release) to release main with a chosen bump.
on:
  push:
    branches: [main]
    paths-ignore: ["**.md", "docs/**", ".vscode/**"]
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]
  workflow_dispatch:
    inputs:
      bump:
        description: Bump (auto reads the pull requests' labels)
        type: choice
        options: [auto, patch, minor, major]
        default: auto

# Releases run one at a time, in push order; a pull request's dry run is replaced by its latest.
concurrency:
  group: release-${{ github.event_name == 'pull_request' && github.event.pull_request.number || 'main' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  plan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      release: ${{ steps.next.outputs.release }}
      version: ${{ steps.next.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Next version
        id: next
        env:
          GH_TOKEN: ${{ github.token }}
          BUMP: ${{ inputs.bump || 'auto' }}
          PR: ${{ github.event.pull_request.number }}
        run: scripts/next-version.sh

  build:
    needs: plan
    if: github.event_name != 'pull_request' && needs.plan.outputs.release == 'true'
    uses: ./.github/workflows/build.yml
    with:
      version: ${{ needs.plan.outputs.version }}

  publish:
    needs: [plan, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: Applarchy-dmg
          path: dist

      # A tag made with the workflow's token starts no other workflow, so the build above
      # runs in this one (and the tag needs no trigger of its own).
      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.plan.outputs.version }}
        run: |
          gh release create "v$VERSION" dist/*.dmg --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "Applarchy $VERSION" --generate-notes
