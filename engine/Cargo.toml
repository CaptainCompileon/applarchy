[package]
name = "ttfx"
version = "0.5.0"
edition = "2021"
description = "Terminal text effects — a Rust port of terminaltexteffects (TTE)"
license = "MIT"

[lib]
crate-type = ["rlib", "staticlib"]

[dependencies]
clap = { version = "4", features = ["derive"] }
clap_complete = "4.6.9"
terminal_size = "0.4"

[profile.release]
lto = true
strip = true
codegen-units = 1
# Unwind, so the C API (src/saver_ffi.rs) can catch a panic in an effect and skip it,
# instead of taking down the screensaver host or the app.
panic = "unwind"
